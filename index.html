<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search Product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="welcome-page" id="welcome-page">
    <div class="logo-container">
      <img src="comap_logo.jpg" alt="CÔ MẬP FASHION NÈ" class="logo">
    </div>
    <div class="search-container">
      <input type="text" id="welcomeProductCode" placeholder="Nhập mã sản phẩm">
      <button class="search-button" onclick="goToResultPage()">Tìm</button>
    </div>
  </div>

  <div class="result-page" id="result-page" style="display: none;">
    <div class="image-container">
      <img src="comap_logo.jpg" alt="Product Image" id="product-image" class="product-image">
    </div>
    <div class="info-container">
      <div class="sizes">
        <ul id="size-list" class="size-list"></ul>
      </div>
      <div class="price">
        <p id="product-price">Không có giá</p>
      </div>
      <div class="location">
        <p id="location-info">Không có vị trí</p>
      </div>
    </div>
    <div class="search-container">
      <input type="text" id="productCode" placeholder="Nhập mã sản phẩm khác">
      <button class="search-button" onclick="searchProduct()">Tìm</button>
    </div>
    <button id="backButton" class="back-button">Quay lại</button>
  </div>

  <script src="app.js"></script>

  <script>
    const welcomeInput = document.getElementById("welcomeProductCode");
    const resultInput = document.getElementById("productCode");

    document.addEventListener("DOMContentLoaded", function () {
      welcomeInput.focus();
      welcomeInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          goToResultPage();
        }
      });

      let welcomeTimeout = null;
      welcomeInput.addEventListener("input", () => {
        clearTimeout(welcomeTimeout);
        welcomeTimeout = setTimeout(() => {
          if (welcomeInput.value.trim() !== "") goToResultPage();
        }, 500);
      });

      resultInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          searchProduct();
        }
      });
    });

    function goToResultPage() {
      const welcomeProductCode = welcomeInput.value.trim();
      if (welcomeProductCode) {
        resultInput.value = welcomeProductCode;
        document.getElementById('welcome-page').style.display = 'none';
        document.getElementById('result-page').style.display = 'block';
        searchProduct();
      } else {
        alert("Vui lòng nhập mã sản phẩm!");
      }
    }
  </script>
</body>
</html>
