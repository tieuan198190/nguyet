<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Product</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Thư viện html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Tối ưu hiển thị danh sách size */
        #size-list p {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
    </style>
</head>
<body>
    <!-- Welcome Page -->
    <div class="welcome-page" id="welcome-page">
        <div class="logo-container">
            <img src="comap_logo.jpg" alt="CÔ MẬP FASHION NÈ" class="logo">
        </div>
        <div class="search-container">
            <input type="text" id="welcomeProductCode" placeholder="Search">
            <button class="search-button" onclick="goToResultPage()">Tìm</button>
        </div>
    </div>

    <!-- Result Page -->
    <div class="result-page" id="result-page" style="display: none;">
        <div class="image-container">
            <img src="" alt="Product Image" id="product-image" class="product-image">
        </div>
        <div class="details-container">
            <div class="info-container">
                <div class="sizes" id="sizes">
                    <ul id="size-list" class="size-list">
                        <!-- Danh sách size sẽ được hiển thị tại đây -->
                    </ul>
                </div>
                <div class="location">
                    <p><span id="location-info">Không có vị trí</span></p>
                </div>
            </div>
            <div class="search-container">
                <input type="text" id="productCode" placeholder="Search">
                <button class="search-button" onclick="searchProduct()">Tìm</button>
                <button class="search-button" onclick="printAllSizes()">In PDF</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
